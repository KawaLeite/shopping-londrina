<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" fill="none">
  <defs>
    <linearGradient id="shieldRed" x1="0" y1="0" x2="120" y2="120" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#E11D48"/>
      <stop offset="50%" stop-color="#C8102E"/>
      <stop offset="100%" stop-color="#88091E"/>
    </linearGradient>
    <linearGradient id="crownGold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FDE047"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>
  </defs>

  <!-- Outer Circle Badge -->
  <circle cx="60" cy="60" r="56" fill="#FFF1F2" stroke="#FECDD3" stroke-width="2"/>
  <circle cx="60" cy="60" r="50" fill="url(#shieldRed)"/>

  <!-- Mural Crown (Towers of Londrina) -->
  <rect x="35" y="18" width="11" height="12" rx="2" fill="url(#crownGold)"/>
  <rect x="52" y="15" width="16" height="15" rx="2" fill="url(#crownGold)"/>
  <rect x="74" y="18" width="11" height="12" rx="2" fill="url(#crownGold)"/>
  <rect x="32" y="28" width="56" height="5" rx="2" fill="#FEF08A"/>

  <!-- Heraldic Shield -->
  <path d="M34 36 H86 V66 C86 84 60 95 60 95 C60 95 34 84 34 66 Z" fill="#FFFFFF" stroke="url(#crownGold)" stroke-width="3"/>

  <!-- Rising Sun & Red Upper Half -->
  <path d="M37 39 H83 V58 H37 Z" fill="#C8102E"/>
  <circle cx="60" cy="52" r="9" fill="#FBBF24"/>

  <!-- Green Coffee Hills & Red Earth (Terra Roxa / Pé Vermelho) -->
  <path d="M39 66 Q60 59 81 66" stroke="#15803D" stroke-width="5" stroke-linecap="round" fill="none"/>
  <path d="M43 75 Q60 69 77 75" stroke="#C8102E" stroke-width="4.5" stroke-linecap="round" fill="none"/>

  <!-- Coffee Branches Left & Right -->
  <path d="M26 78 C20 62, 22 44, 29 34" stroke="#FDE047" stroke-width="3" stroke-linecap="round" fill="none"/>
  <path d="M94 78 C100 62, 98 44, 91 34" stroke="#FDE047" stroke-width="3" stroke-linecap="round" fill="none"/>

  <!-- Bottom Ribbon -->
  <rect x="28" y="96" width="64" height="13" rx="6.5" fill="#FFFFFF"/>
  <text x="60" y="105" text-anchor="middle" font-family="Plus Jakarta Sans, Inter, sans-serif" font-weight="800" font-size="8.2" fill="#C8102E" letter-spacing="1">LONDRINA</text>
</svg>

